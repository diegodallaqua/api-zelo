name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Toda segunda às 06:00 UTC, para pegar novas regras de análise mesmo sem mudanças no código.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  analise:
    name: Análise de segurança (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # A action consulta a execução do workflow ao enviar o resultado; sem actions: read, a API
      # responde "Resource not accessible by integration".
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Build real (com Lombok) para a análise enxergar o código gerado.
      - name: Compilar
        run: ./mvnw -B -ntp -DskipTests compile

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin

name: Segredos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Busca de segredos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Histórico completo: um segredo commitado e depois apagado continua no Git.
          fetch-depth: 0

      # CLI oficial em contêiner, com versão fixa. Não exige licença, ao contrário da gitleaks-action
      # em repositórios de organização. --redact evita que o segredo encontrado apareça no log.
      - name: gitleaks
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.21.2
          detect --source /repo --redact --verbose --no-banner

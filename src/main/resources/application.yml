spring:
  application:
    name: api-zelo
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zelo}
    username: ${DB_USERNAME:zelo}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    com.zelo: INFO

zelo:
  seguranca:
    jwt:
      # Segredo HMAC-SHA256 com no mínimo 32 bytes. Obrigatório.
      segredo: ${ZELO_JWT_SECRET:}
      emissor: zelo-api
      expiracao-acesso: 15m
      expiracao-refresh: 30d
    cors:
      origens-permitidas: ${ZELO_CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

  rate-limit:
    habilitado: true
    requisicoes-por-minuto: 120
    requisicoes-autenticacao-por-minuto: 10

  cadastro:
    # Regra de negócio 3.1: apenas estes domínios podem criar conta de cidadão.
    dominios-email-permitidos:
      - gmail.com
      - googlemail.com
      - yahoo.com
      - yahoo.com.br
      - hotmail.com
      - hotmail.com.br
      - outlook.com
      - outlook.com.br
      - live.com
      - msn.com
    versao-termos-de-uso: "1.0"
    versao-politica-de-privacidade: "1.0"
    versao-consentimento-localizacao: "1.0"

  admin-inicial:
    # Se informados e não houver nenhum administrador, um é criado na inicialização.
    # O endereço é obrigatório para toda conta; cidade-id é o código IBGE da cidade.
    nome: Administrador
    email: ${ZELO_ADMIN_EMAIL:}
    senha: ${ZELO_ADMIN_SENHA:}
    endereco:
      cep: ${ZELO_ADMIN_CEP:}
      rua: ${ZELO_ADMIN_RUA:}
      bairro: ${ZELO_ADMIN_BAIRRO:}
      numero: ${ZELO_ADMIN_NUMERO:}
      complemento: ${ZELO_ADMIN_COMPLEMENTO:}
      cidade-id: ${ZELO_ADMIN_CIDADE_ID:}

  ocorrencia:
    fuso-horario: America/Sao_Paulo
    limite-diario-por-usuario: 5
    raio-duplicidade-metros: 25
    prazo-contestacao: 15d
    dias-sem-atividade-para-aviso: 90
    dias-apos-aviso-para-arquivar: 30
    anos-retencao-autor: 5
    mapa:
      limite-padrao: 500
      limite-maximo: 1000
    fotos:
      minimo: 1
      maximo: 5
      tamanho-maximo: 10MB
      dimensao-maxima: 1920
      qualidade-jpeg: 0.8
      megapixels-maximo: 50
    rotinas:
      cron-arquivamento: "0 0 3 * * *"
      cron-retencao: "0 30 3 * * *"
      cron-prioridade: "0 0 4 * * *"
      cron-resumo-gestor: "0 0 7 * * *"

  armazenamento:
    # local: grava em disco e serve em /arquivos/** (desenvolvimento). r2: Cloudflare R2.
    tipo: ${ZELO_ARMAZENAMENTO:local}
    local:
      diretorio: ${ZELO_ARMAZENAMENTO_DIR:./uploads}
      url-base: ${ZELO_ARMAZENAMENTO_URL:http://localhost:8080/arquivos}
    r2:
      account-id: ${R2_ACCOUNT_ID:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
      bucket: ${R2_BUCKET:}
      url-publica: ${R2_URL_PUBLICA:}

  localidade:
    aviso-canal-nao-oficial-padrao: >-
      O Zelo não é um canal oficial da prefeitura e não garante prazo de conserto.
      Para solicitações formais, use os canais oficiais da sua cidade.
    ibge:
      url-base: https://servicodados.ibge.gov.br/api
      # minima | intermediaria | maxima. "maxima" deixa as divisas mais precisas na validação.
      qualidade-malha: maxima
      # Importa estados e as 5.570 cidades na primeira inicialização (tabela vazia), antes de criar o admin inicial.
      importar-na-inicializacao: ${ZELO_IMPORTAR_CIDADES:true}
      timeout: 120s
